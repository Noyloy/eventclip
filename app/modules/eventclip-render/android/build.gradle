plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.eventcliprender'
version = '0.1.0'

android {
  namespace "expo.modules.eventcliprender"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions {
    unitTests.includeAndroidResources = false
  }
}

dependencies {
  implementation "androidx.activity:activity:1.8.0" // already cached; system Photo Picker contract only
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
  implementation "androidx.media3:media3-transformer:1.5.1"
  implementation "androidx.media3:media3-effect:1.5.1"
  implementation "androidx.media3:media3-common:1.5.1"
  testImplementation "junit:junit:4.13.2"
}
